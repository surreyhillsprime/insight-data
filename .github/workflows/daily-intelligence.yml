name: Daily INSIGHT Flood Context

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: insight-data-refresh
  cancel-in-progress: false

jobs:
  daily-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronise selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - name: Refresh current flood context
        run: |
          python3 scripts/enrich_property_context.py \
            --missing-only \
            --force-flood-refresh \
            --disable-osm \
            --pause 0 \
            --progress-every 250 \
            --max-source-errors 25

      - name: Synchronise refreshed flood context
        run: |
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/surrey-transactions.js; then
            echo "::error::Flood refresh produced Git conflicts; refusing to build public outputs."
            exit 1
          fi

      - name: Check data completeness
        run: python3 scripts/check_data_completeness.py

      - name: Materialise current Today opportunities
        run: |
          python3 scripts/build_property_records.py \
            --transactions outputs/surrey-transactions.js \
            --sales-history outputs/sales-history.js \
            --planning-history outputs/planning-history.js \
            --output /tmp/insight-property-records.js
          python3 scripts/validate_property_records.py \
            /tmp/insight-property-records.js \
            --transactions outputs/surrey-transactions.js
          python3 scripts/build_today_feed.py \
            --property-records /tmp/insight-property-records.js \
            --output outputs/today-feed.js
          python3 scripts/validate_today_feed.py outputs/today-feed.js

      - name: Commit updated flood context and opportunities
        run: |
          git config user.name "INSIGHT data bot"
          git config user.email "insight-data-bot@users.noreply.github.com"
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Refresh produced unresolved Git conflicts; refusing to commit."
            exit 1
          fi
          if grep -Eq '^(<<<<<<< |=======|>>>>>>> )' outputs/surrey-transactions.js outputs/today-feed.js; then
            echo "::error::Feed contains Git conflict markers; refusing to commit."
            exit 1
          fi
          PYTHONPATH=scripts python3 - <<'PY'
          from pathlib import Path
          from insight_data_utils import FEED_SCHEMA_VERSION, read_js

          path = Path("outputs/surrey-transactions.js")
          text = path.read_text(encoding="utf-8")
          transactions, summary, meta = read_js(path)
          assert text.count("window.SURREY_LAND_REG_") == 3, "feed must contain exactly three assignments"
          assert transactions and isinstance(summary, dict), "feed data is incomplete"
          assert meta.get("schemaVersion") == FEED_SCHEMA_VERSION, "feed schemaVersion is stale"
          PY
          git add outputs/surrey-transactions.js outputs/today-feed.js
          if git diff --cached --quiet; then
            echo "No daily flood-context or opportunity changes to commit."
          else
            git commit -m "Update INSIGHT daily context and opportunities"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Concurrent publication conflicted with the daily refresh."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Daily refresh could not publish after 3 attempts."
                exit 1
              fi
            done
          fi
