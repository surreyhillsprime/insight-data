name: Daily INSIGHT Today Opportunities

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

concurrency:
  group: insight-data-refresh
  queue: max
  cancel-in-progress: false

jobs:
  daily-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronise selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - name: Check whether all Today dependencies are release-ready
        id: release
        run: |
          if python3 scripts/check_data_completeness.py --strict-metadata; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Today remains on its last validated snapshot until a dependent producer repairs itself."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialise current Today opportunities
        if: steps.release.outputs.ready == 'true'
        run: |
          python3 scripts/build_property_records.py \
            --transactions outputs/surrey-transactions.js \
            --sales-history outputs/sales-history.js \
            --planning-history outputs/planning-history.js \
            --output /tmp/insight-property-records.js
          python3 scripts/validate_property_records.py \
            /tmp/insight-property-records.js \
            --transactions outputs/surrey-transactions.js
          python3 scripts/build_today_feed.py \
            --property-records /tmp/insight-property-records.js \
            --output outputs/today-feed.js
          python3 scripts/validate_today_feed.py outputs/today-feed.js

      - name: Commit updated Today opportunities
        if: steps.release.outputs.ready == 'true'
        run: |
          git config user.name "INSIGHT data bot"
          git config user.email "insight-data-bot@users.noreply.github.com"
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Today refresh produced unresolved Git conflicts; refusing to commit."
            exit 1
          fi
          if grep -Eq '^(<<<<<<< |=======|>>>>>>> )' outputs/today-feed.js; then
            echo "::error::Today feed contains Git conflict markers; refusing to commit."
            exit 1
          fi
          git add outputs/today-feed.js
          if git diff --cached --quiet; then
            echo "No Today opportunity changes to commit."
          else
            git commit -m "Update INSIGHT Today opportunities"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Concurrent publication conflicted with the Today refresh."
                exit 1
              fi
              python3 scripts/check_data_completeness.py --strict-metadata
              python3 scripts/validate_today_feed.py outputs/today-feed.js
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Today refresh could not publish after 3 attempts."
                exit 1
              fi
            done
          fi
