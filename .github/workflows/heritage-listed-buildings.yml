name: Daily INSIGHT Listed Buildings

on:
  workflow_dispatch:
  schedule:
    # Historic England refreshes the NHLE service nightly.
    - cron: "15 8 * * *"

permissions:
  contents: write

concurrency:
  group: insight-data-refresh
  queue: max
  cancel-in-progress: false

jobs:
  listed-buildings:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Synchronise selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"

      - name: Reconcile the reviewed property universe fail-closed
        run: |
          python3 scripts/reconcile_heritage_address_audit.py --write
          python3 scripts/build_heritage_address_ledger.py

      - name: Refresh Historic England listed-building evidence
        run: python3 scripts/enrich_listed_buildings.py

      - name: Test and validate listed-building publication
        run: |
          PYTHONPATH=scripts python3 -m unittest \
            tests.test_heritage_audit_reconciliation \
            tests.test_listed_buildings
          python3 scripts/build_heritage_address_ledger.py --check
          python3 scripts/enrich_listed_buildings.py --validate-only

      - name: Commit updated evidence
        run: |
          git config user.name "INSIGHT data bot"
          git config user.email "insight-data-bot@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Heritage refresh produced unresolved Git conflicts; refusing to commit."
            exit 1
          fi
          if grep -Eq '^(<<<<<<< |=======|>>>>>>> )' outputs/surrey-transactions.js; then
            echo "::error::Feed contains Git conflict markers; refusing to commit."
            exit 1
          fi
          python3 scripts/enrich_listed_buildings.py --validate-only
          git add \
            config/heritage-listing-address-audit.json \
            config/heritage-listing-overrides.json \
            outputs/surrey-transactions.js
          if git diff --cached --quiet; then
            echo "No semantic Historic England changes to commit."
          else
            git commit -m "Update INSIGHT listed-building evidence"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Concurrent publication conflicted with the heritage refresh."
                exit 1
              fi
              if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/surrey-transactions.js; then
                echo "::error::Heritage refresh contains conflicts after rebasing."
                exit 1
              fi
              PYTHONPATH=scripts python3 -m unittest \
                tests.test_heritage_audit_reconciliation \
                tests.test_listed_buildings
              python3 scripts/build_heritage_address_ledger.py --check
              python3 scripts/enrich_listed_buildings.py --validate-only
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Heritage refresh could not publish after 3 attempts."
                exit 1
              fi
            done
          fi
