name: Sales history feed

on:
  workflow_dispatch:
  schedule:
    - cron: "30 6 2 * *"

permissions:
  contents: write

concurrency:
  group: insight-data-refresh
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Synchronise selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check producer prerequisites
        run: python3 scripts/check_data_completeness.py --base-only
      - name: Restore resumable postcode cache
        uses: actions/cache/restore@v4
        with:
          path: work/title-history-cache.json
          key: title-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: title-history-
      - name: Build complete Price Paid history feed
        run: >-
          python3 scripts/collect_title_history.py
          --input outputs/surrey-transactions.js
          --output outputs/sales-history.js
          --cache work/title-history-cache.json
          --seed-feed outputs/sales-history.js
          --deployment-mode commercial
          --refresh-days 28
          --workers 3
          --batch-size 8
      - name: Validate commercial feed against every £2m+ property
        run: >-
          python3 scripts/validate_sales_history_feed.py
          outputs/sales-history.js
          --base-feed outputs/surrey-transactions.js
          --minimum-property-coverage-percent 99
          --minimum-transactions 6735
          --maximum-properties-unavailable 4
          --maximum-age-days 45
      - name: Save resumable postcode cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: work/title-history-cache.json
          key: title-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Commit changed feed
        run: |
          git config user.name "insight-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/sales-history.js; then
            echo "Sales-history refresh produced Git conflicts; refusing to publish." >&2
            exit 1
          fi
          python3 scripts/validate_sales_history_feed.py \
            outputs/sales-history.js \
            --base-feed outputs/surrey-transactions.js \
            --minimum-property-coverage-percent 99 \
            --minimum-transactions 6735 \
            --maximum-properties-unavailable 4 \
            --maximum-age-days 45
          python3 scripts/build_property_records.py \
            --transactions outputs/surrey-transactions.js \
            --sales-history outputs/sales-history.js \
            --planning-history outputs/planning-history.js \
            --output /tmp/insight-property-records.js
          python3 scripts/validate_property_records.py \
            /tmp/insight-property-records.js \
            --transactions outputs/surrey-transactions.js
          python3 scripts/build_today_feed.py \
            --property-records /tmp/insight-property-records.js \
            --output outputs/today-feed.js
          python3 scripts/validate_today_feed.py outputs/today-feed.js
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/today-feed.js; then
            echo "Today feed contains Git conflict markers; refusing to publish." >&2
            exit 1
          fi
          git add outputs/sales-history.js outputs/today-feed.js
          if git diff --cached --quiet; then
            echo "No sales-history or Today changes to commit."
          else
            git commit -m "Update complete sales history and Today opportunities"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Concurrent publication conflicted with the sales-history refresh."
                exit 1
              fi
              if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/sales-history.js outputs/today-feed.js; then
                echo "::error::Sales-history refresh contains conflicts after rebasing."
                exit 1
              fi
              python3 scripts/validate_sales_history_feed.py \
                outputs/sales-history.js \
                --base-feed outputs/surrey-transactions.js \
                --minimum-property-coverage-percent 99 \
                --minimum-transactions 6735 \
                --maximum-properties-unavailable 4 \
                --maximum-age-days 45
              python3 scripts/build_property_records.py \
                --transactions outputs/surrey-transactions.js \
                --sales-history outputs/sales-history.js \
                --planning-history outputs/planning-history.js \
                --output /tmp/insight-property-records.js
              python3 scripts/validate_property_records.py \
                /tmp/insight-property-records.js \
                --transactions outputs/surrey-transactions.js
              python3 scripts/validate_today_feed.py outputs/today-feed.js
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Sales-history refresh could not publish after 3 attempts."
                exit 1
              fi
            done
          fi
