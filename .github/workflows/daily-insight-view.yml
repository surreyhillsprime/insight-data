name: Daily INSIGHT View

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Surrey intelligence news feed"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "7 0 * * *"
      timezone: "Europe/London"
    - cron: "0 6 * * *"
      timezone: "Europe/London"
    # Cheap HPI release gate; collection runs only when a newer official month is due.
    - cron: "35 9 * * *"
      timezone: "Europe/London"
    # Cheap calendar gate; no year-specific cron update is needed for new dates.
    - cron: "*/5 11-14 * * *"
      timezone: "Europe/London"
    # Retry incomplete observations and recover from a delayed/missed daily run.
    - cron: "17 * * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: insight-daily-briefing-${{ github.event.repository.default_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start from selected branch
        run: |
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"

      - name: Choose calendar-driven refresh or recovery
        id: cadence
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          mode=$(python3 scripts/check_insight_view_freshness.py --cadence \
            --event-name "$EVENT_NAME" --event-schedule "$EVENT_SCHEDULE")
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Collect governed official observations
        if: steps.cadence.outputs.mode != 'skip'
        env:
          REFRESH_MODE: ${{ steps.cadence.outputs.mode }}
        run: |
          if [ "$REFRESH_MODE" = "mpc" ]; then
            python3 scripts/collect_insight_view.py --mpc-only
          elif [ "$REFRESH_MODE" = "routine" ]; then
            python3 scripts/collect_insight_view.py --skip-hpi
          else
            python3 scripts/collect_insight_view.py
          fi

      - name: Build the dated editorial briefing
        if: steps.cadence.outputs.mode != 'skip'
        run: python3 scripts/build_insight_view.py

      - name: Validate the briefing contract
        if: steps.cadence.outputs.mode != 'skip'
        run: python3 scripts/validate_insight_view.py outputs/insight-view.js

      - name: Refuse conflicted output
        if: steps.cadence.outputs.mode != 'skip'
        run: |
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' \
            config/insight-view-snapshot.json outputs/insight-view.js; then
            echo "::error::Conflict markers found in the INSIGHT View inputs or output."
            exit 1
          fi

      - name: Commit changed briefing
        if: steps.cadence.outputs.mode != 'skip'
        run: |
          if git diff --quiet -- config/insight-view-snapshot.json outputs/insight-view.js; then
            exit 0
          fi
          git config user.name "insight-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/insight-view-snapshot.json outputs/insight-view.js
          git commit -m "Update daily INSIGHT View"
          for attempt in 1 2 3; do
            if git fetch origin "$TARGET_BRANCH" &&
              git rebase "origin/$TARGET_BRANCH" &&
              python3 scripts/validate_insight_view.py outputs/insight-view.js &&
              git push origin "HEAD:$TARGET_BRANCH"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Unable to publish the validated INSIGHT View after three attempts."
              exit 1
            fi
          done

      - name: Verify published briefing and source freshness
        if: steps.cadence.outputs.mode != 'skip' || github.event.schedule == '17 * * * *'
        run: python3 scripts/check_insight_view_freshness.py
