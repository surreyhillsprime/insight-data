name: Planning history feed

on:
  schedule:
    - cron: '45 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: insight-data-refresh
  cancel-in-progress: false

jobs:
  build:
    # Fail closed until an approved provider and redistribution terms exist.
    if: ${{ vars.PLANNING_COMMERCIAL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronise selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require licensed source
        env:
          PLANNING_DATA_SOURCE: ${{ secrets.PLANNING_DATA_SOURCE }}
          PLANNING_SOURCE_NAME: ${{ vars.PLANNING_SOURCE_NAME }}
          PLANNING_SOURCE_LICENCE_URL: ${{ vars.PLANNING_SOURCE_LICENCE_URL }}
        run: |
          test -n "$PLANNING_DATA_SOURCE"
          test -n "$PLANNING_SOURCE_NAME"
          test -n "$PLANNING_SOURCE_LICENCE_URL"
          case "$PLANNING_SOURCE_LICENCE_URL" in
            https://*) ;;
            *) echo "Planning source licence URL must use HTTPS" >&2; exit 1 ;;
          esac
      - name: Build planning feed
        env:
          PLANNING_DATA_SOURCE: ${{ secrets.PLANNING_DATA_SOURCE }}
          PLANNING_SOURCE_NAME: ${{ vars.PLANNING_SOURCE_NAME }}
          PLANNING_SOURCE_LICENCE_URL: ${{ vars.PLANNING_SOURCE_LICENCE_URL }}
        run: >-
          python3 scripts/build_commercial_planning_feed.py
          --source "$PLANNING_DATA_SOURCE"
          --source-name "$PLANNING_SOURCE_NAME"
          --source-licence-url "$PLANNING_SOURCE_LICENCE_URL"
          --input-js outputs/surrey-transactions.js
          --write-js outputs/planning-history.js
      - name: Validate licensed feed against every £2m+ property
        run: >-
          python3 scripts/validate_planning_feed.py
          outputs/planning-history.js
          --base-feed outputs/surrey-transactions.js
          --minimum-properties-with-history 3204
          --minimum-applications 21180
          --maximum-age-days 8
      - name: Commit changed feed
        run: |
          git config user.name "insight-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/planning-history.js; then
            echo "Planning refresh produced Git conflicts; refusing to publish." >&2
            exit 1
          fi
          python3 scripts/validate_planning_feed.py \
            outputs/planning-history.js \
            --base-feed outputs/surrey-transactions.js \
            --minimum-properties-with-history 3204 \
            --minimum-applications 21180 \
            --maximum-age-days 8
          python3 scripts/build_property_records.py \
            --transactions outputs/surrey-transactions.js \
            --sales-history outputs/sales-history.js \
            --planning-history outputs/planning-history.js \
            --output /tmp/insight-property-records.js
          python3 scripts/validate_property_records.py \
            /tmp/insight-property-records.js \
            --transactions outputs/surrey-transactions.js
          python3 scripts/build_today_feed.py \
            --property-records /tmp/insight-property-records.js \
            --output outputs/today-feed.js
          python3 scripts/validate_today_feed.py outputs/today-feed.js
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/today-feed.js; then
            echo "Today feed contains Git conflict markers; refusing to publish." >&2
            exit 1
          fi
          git add outputs/planning-history.js outputs/today-feed.js
          if git diff --cached --quiet; then
            echo "No planning-history or Today changes to commit."
          else
            git commit -m "Update planning history and Today opportunities"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
