name: Surrey intelligence news feed

on:
  workflow_dispatch:
  repository_dispatch:
    types: [news-refresh]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: insight-news-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start from selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
      - name: Validate source rights and adapter contracts
        run: |
          python3 scripts/validate_news_sources.py
          python3 -m unittest discover -s tests -p 'test_news*.py'
      - name: Collect and score link-only article metadata
        run: python3 scripts/collect_news.py
      - name: Validate collected news
        run: |
          python3 scripts/validate_news_feed.py outputs/news-feed.js
          python3 scripts/check_news_freshness.py
      - name: Publish source health summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          text = Path("outputs/news-feed.js").read_text(encoding="utf-8")
          prefix = "window.INSIGHT_NEWS_META = "
          metadata = next(
              json.loads(line[len(prefix):-1])
              for line in text.splitlines()
              if line.startswith(prefix) and line.endswith(";")
          )
          print("## News source health")
          print()
          print("| Source | Mode | Status | Discovered | Qualified | Published |")
          print("|---|---:|---:|---:|---:|---:|")
          for row in metadata["sourceDiagnostics"]:
              print(
                  f"| {row['sourceId']} | {row['publicationMode']} | {row['status']} "
                  f"| {row['discovered']} | {row['qualified']} | {row['retained']} |"
              )
          PY
      - name: Refuse conflicted output
        run: |
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/news-feed.js; then
            echo 'Conflict markers found in news feed' >&2
            exit 1
          fi
      - name: Commit changed feed
        run: |
          if git diff --quiet -- outputs/news-feed.js; then exit 0; fi
          git config user.name "insight-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          if git diff --name-only --diff-filter=U | grep -q . || grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/news-feed.js; then
            echo 'News refresh produced Git conflicts; refusing to commit' >&2
            exit 1
          fi
          python3 scripts/validate_news_sources.py
          python3 scripts/validate_news_feed.py outputs/news-feed.js
          python3 scripts/check_news_freshness.py
          git add outputs/news-feed.js
          if git diff --cached --quiet; then
            echo "No news feed changes to commit after synchronisation."
          else
            git commit -m "Update Surrey intelligence news feed"
            for attempt in 1 2 3; do
              git fetch origin "$GITHUB_REF_NAME"
              if ! git rebase --autostash "origin/$GITHUB_REF_NAME"; then
                git rebase --abort || true
                echo "::error::Concurrent publication conflicted with the news refresh."
                exit 1
              fi
              if git push origin "HEAD:$GITHUB_REF_NAME"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::News refresh could not publish after 3 attempts."
                exit 1
              fi
            done
          fi
