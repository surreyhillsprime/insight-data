name: Surrey intelligence news feed

on:
  workflow_dispatch:
  repository_dispatch:
    types: [news-refresh]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: insight-news-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start from selected branch
        run: |
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
      - name: Validate source rights and adapter contracts
        run: |
          python3 scripts/validate_news_sources.py
          python3 -m unittest discover -s tests -p 'test_news*.py'
          python3 -m unittest tests.test_update_today_news
      - name: Collect and score link-only article metadata
        run: python3 scripts/collect_news.py
      - name: Project current news into Today
        run: python3 scripts/update_today_news.py
      - name: Validate atomic publication
        run: |
          python3 scripts/validate_news_feed.py outputs/news-feed.js
          python3 scripts/check_news_freshness.py
          python3 scripts/validate_today_news.py
      - name: Publish source health summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          text = Path("outputs/news-feed.js").read_text(encoding="utf-8")
          prefix = "window.INSIGHT_NEWS_META = "
          metadata = next(
              json.loads(line[len(prefix):-1])
              for line in text.splitlines()
              if line.startswith(prefix) and line.endswith(";")
          )
          print("## News source health")
          print()
          print("| Source | Mode | Status | Discovered | Qualified | Published |")
          print("|---|---:|---:|---:|---:|---:|")
          for row in metadata["sourceDiagnostics"]:
              print(
                  f"| {row['sourceId']} | {row['publicationMode']} | {row['status']} "
                  f"| {row['discovered']} | {row['qualified']} | {row['retained']} |"
              )
          PY
      - name: Refuse conflicted output
        run: |
          if grep -Eq '^(<<<<<<<|=======|>>>>>>>)' outputs/news-feed.js outputs/today-feed.js; then
            echo 'Conflict markers found in news or Today feed' >&2
            exit 1
          fi
      - name: Commit changed feeds atomically
        run: |
          if git diff --quiet -- outputs/news-feed.js outputs/today-feed.js; then exit 0; fi
          git config user.name "insight-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add outputs/news-feed.js outputs/today-feed.js
          git commit -m "Update Surrey intelligence news and Today feeds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          python3 scripts/validate_news_sources.py
          python3 scripts/validate_news_feed.py outputs/news-feed.js
          python3 scripts/update_today_news.py
          python3 scripts/validate_today_news.py
          if ! git diff --quiet -- outputs/today-feed.js; then
            git add outputs/today-feed.js
            git commit --amend --no-edit
          fi
          git diff --exit-code -- outputs/news-feed.js outputs/today-feed.js
          git push origin "HEAD:$GITHUB_REF_NAME"
