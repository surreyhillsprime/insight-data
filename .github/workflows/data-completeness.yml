name: INSIGHT Data Completeness

on:
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * *"

permissions:
  contents: read

concurrency:
  group: insight-data-refresh
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test £2m property-feed contract
        run: PYTHONPATH=scripts python3 -m unittest discover -s tests
      - name: Verify published private-estate asset
        run: |
          python3 scripts/build_private_estates_asset.py
          git diff --exit-code -- outputs/private-estates.js
      - name: Check shared feed coverage
        run: python3 scripts/check_data_completeness.py --strict-metadata
      - name: Check published sales-history identity and freshness
        run: >-
          python3 scripts/validate_sales_history_feed.py
          outputs/sales-history.js
          --base-feed outputs/surrey-transactions.js
          --minimum-properties-with-history 3942
          --minimum-transactions 6735
          --maximum-properties-unavailable 4
          --maximum-age-days 45
      - name: Check published planning-history identity and freshness
        if: ${{ vars.PLANNING_COMMERCIAL_ENABLED == 'true' }}
        run: >-
          python3 scripts/validate_planning_feed.py
          outputs/planning-history.js
          --base-feed outputs/surrey-transactions.js
          --minimum-properties-with-history 3204
          --minimum-applications 21180
          --maximum-age-days 8
      - name: Check explicit blocked planning publication
        if: ${{ vars.PLANNING_COMMERCIAL_ENABLED != 'true' }}
        run: >-
          python3 scripts/validate_planning_feed.py
          outputs/planning-history.js
          --allow-blocked
